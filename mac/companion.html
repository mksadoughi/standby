<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Standby companion</title>
<!--
  The companion: a call in a corner (the orb is for calls only, never a meeting). Two
  small windows from mac/native/macos/companion.py, each hugging what it holds:
    /companion        the orb's window, the anchor: the orb, and its controls on hover
    /companion#words  the words' window, its child: only a mic macOS refuses, said
    /companion#card   the call's visual card, its child too: the frame around a visual (close, ‹ n / m ›, New,
                      Drawing…); the visual itself is a sandbox of its own the panel lays over the area left for it
  the orb's window is one fixed size while live and never animates; the page grows the
  orb by transform from its corner (26 at rest, 40 pointed at, 72 talking) and slides its
  buttons in beside it. Clicks outside the hit areas pass to the app beneath.
  Opened anywhere else (ui_preview), it draws a stand-in for the glass.
  Native → page: edge("left"|"right", "top"|"bottom"), hover(bool), dragged() (the press is a drag).
  Page → native, through messageHandlers.sb:
    {type:"orb", w, h, glyph, inset, glass:{x, y, w, h, radius}|null}  x from the inner side
    {type:"hit", areas:[{x, y, r} | {x, y, w, h, radius}]}           page px from the top left
    {type:"words", w, h, radius, ms}                                 w: 0 hides; radius null: no glass
    {type:"card", w, h, area:{x, y, w, h}, session, id, hit:[...], ms} w: 0 hides; id 0: no visual in it yet
  Native → the card: visualSize({want, w, h}) as the visual's content changes.
    {type:"menu", x, y}, {type:"expand"}, {type:"end"}, {type:"settings", pane}
-->
<style>
:root{--c-rec:#e5484d;--c-text:#1d1d1f;--c-muted:#6e6e73;--c-hover:rgba(0,0,0,.06);--c-press:rgba(0,0,0,.1);
--c-attn:#f5a524;--c-surface:rgba(252,252,252,.92);--c-edge:rgba(0,0,0,.09);
--c-shadow:0 10px 30px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.12);--c-ring:rgba(80,70,229,.6);--orb:88px;--ox:100%;--oy:100%;
--c-cap:rgba(246,246,250,.8);--c-you:#55556a;--c-claude:#3a30c8;
--c-pz:radial-gradient(circle at 34% 28%,#f0f0f0 0%,#d2d2d2 38%,#bababa 75%,#b0b0b0 100%);--c-pzbar:rgba(255,255,255,.92);
--c-down:radial-gradient(circle at 34% 28%,#e6e6e6 0%,#b0b0b0 38%,#828282 75%,#707070 100%)}
@media (prefers-color-scheme:dark){:root{--c-rec:#ff5f63;--c-text:#f2f2f4;--c-muted:#a1a1a6;--c-hover:rgba(255,255,255,.08);
--c-press:rgba(255,255,255,.14);--c-surface:rgba(36,36,38,.9);--c-edge:rgba(255,255,255,.1);
--c-shadow:0 10px 30px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);--c-ring:rgba(143,134,255,.75);
--c-cap:rgba(34,34,46,.72);--c-you:#c9c9d6;--c-claude:#c3bfff;
--c-pz:radial-gradient(circle at 34% 28%,#5c5c5c 0%,#3e3e3e 38%,#262626 75%,#1b1b1b 100%);--c-pzbar:rgba(255,255,255,.4);
--c-down:radial-gradient(circle at 34% 28%,#a6a6a6 0%,#707070 38%,#424242 75%,#303030 100%)}}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{font:500 13px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--c-text);
-webkit-user-select:none;user-select:none;cursor:default;-webkit-font-smoothing:antialiased}
body:not(.r){--ox:0%}[data-v=top]{--oy:0%}

/* the orb's window: one size while live; the orb pinned 12 in from the corner, the pill beside it */
.cmp{position:fixed;right:0;bottom:0;width:var(--w,360px);height:var(--h,112px)}
body:not(.r) .cmp{right:auto;left:0}
[data-v=top] .cmp{bottom:auto;top:0}
.cmp button{all:unset;position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
flex:none;color:var(--c-muted);transition:background .12s,color .12s,transform .12s}
.cmp button:hover{background:var(--c-hover);color:var(--c-text)}
.cmp button:active{background:var(--c-press);transform:scale(.94)}
.cmp button:focus-visible{outline:2px solid rgba(80,70,229,.55);outline-offset:1px}
.cmp button:disabled{opacity:.35}.cmp button:disabled:hover{background:none;color:var(--c-muted)}
/* End: the red hang-up phone, its word in the tip */
.cmp button.hang{color:var(--c-rec)}.cmp button.hang:hover{color:var(--c-rec);background:color-mix(in srgb,var(--c-rec) 14%,transparent)}
/* the buttons, on their own glass, beside the orb. The glass is the panel's and brings its own
   edge: the page draws nothing past the pill or the orb, as the window's edge would cut it into
   a faint rectangle (the user's screen).
   pointed at, the orb stays as it is and the pill rolls out from under it. The pill rides
   a rail that ends at the orb's centre and lies under the orb: shut, it waits behind the orb;
   out, it slides to its place, its outer end round and its inner end running on under the orb
   to its centre, so the menu reads as sliding out of the mini window (the user, 2026-10-23). */
.rail{position:absolute;right:calc(12px + var(--g) / 2);bottom:calc(12px + var(--g) / 2 - var(--ph,40px) / 2);width:calc(var(--w) - 12px - var(--g) / 2);height:var(--ph,40px);
overflow:hidden;pointer-events:none;z-index:0;transition:right .32s cubic-bezier(.23,1,.32,1),bottom .32s cubic-bezier(.23,1,.32,1),width .32s cubic-bezier(.23,1,.32,1)}
body:not(.r) .rail{right:auto;left:calc(12px + var(--g) / 2);transition-property:left,bottom,width}
[data-v=top] .rail{bottom:auto;top:calc(12px + var(--g) / 2 - var(--ph,40px) / 2);transition-property:right,top,width}
body:not(.r)[data-v=top] .rail{transition-property:left,top,width}
.ctls{position:absolute;top:0;right:0;display:flex;flex-direction:row;align-items:center;gap:2px;height:var(--ph,40px);padding:0 calc(var(--g) / 2 + 10px) 0 3px;
box-sizing:border-box;border-radius:var(--pr,20px);pointer-events:auto;transform:translateX(var(--shut,200px));
transition:transform .26s cubic-bezier(.5,0,.75,0),padding .32s cubic-bezier(.23,1,.32,1)}
.rail.out .ctls{transform:none;transition:transform .34s cubic-bezier(.23,1,.32,1),padding .32s cubic-bezier(.23,1,.32,1)}
body:not(.r) .ctls{right:auto;left:0;padding:0 3px 0 calc(var(--g) / 2 + 10px);transform:translateX(calc(-1 * var(--shut,200px)))}
body:not(.r) .rail.out .ctls{transform:none}
.ctls:empty{visibility:hidden}
/* on a call, pointed at (the user, 2026-10-27): one panel rolls out, the session's name and time on
   top, the three icons under it */
.ctls.card{flex-direction:column;align-items:stretch;justify-content:center;gap:2px;padding:6px calc(var(--g) / 2 + 10px) 6px 6px}
body:not(.r) .ctls.card{padding:6px 6px 6px calc(var(--g) / 2 + 10px)}
.ctls .nmrow{display:flex;align-items:center;gap:7px;height:22px;padding:0 8px;font:600 13px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--c-text);white-space:nowrap}
.ctls .nmrow .dot{width:6px;height:6px;border-radius:50%;background:var(--c-rec);flex:none}
.ctls .nmrow .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.ctls .nmrow .tm{margin-left:auto;padding-left:4px;font-weight:500;font-size:12px;color:var(--c-muted);font-variant-numeric:tabular-nums}
.ctls .btns{display:flex;gap:2px}

/* the orb is Claude: a click starts voice mode, another ends it. Its box is always the full
   88, pinned to the corner; it shows at 52 or 88 by one transform from that corner. */
.cmp button.talk{position:absolute;right:12px;bottom:12px;width:var(--orb);height:var(--orb);border-radius:50%;pointer-events:none;z-index:1}
.cmp button.talk:hover,.cmp button.talk:active{background:none;transform:none}
body:not(.r) .cmp button.talk{right:auto;left:12px}
[data-v=top] .cmp button.talk{bottom:auto;top:12px}
.orbs{position:absolute;inset:0;transform:scale(var(--k,.591));transform-origin:var(--ox) var(--oy);transition:transform .32s cubic-bezier(.23,1,.32,1);pointer-events:auto;border-radius:50%}
.orb{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;border-radius:50%;
transform:scale(var(--lv,1));transition:transform .1s linear;
background:radial-gradient(circle at 34% 28%,#d9d6ff 0%,#8f86ff 38%,#5046e5 75%,#3b2fc0 100%);
box-shadow:0 0 8px rgba(80,70,229,.45),0 1px 2px rgba(30,20,120,.25),inset -8px -10px 20px rgba(30,20,120,.35)}
/* its glow stays inside the 12 around it at every size, even grown with your voice: past the
   window's edge it would be cut straight */
/* C · Wave: the sound inside, three bars. At rest the logo's, bold enough to read at 26;
   talking, finer, and they move: with you listening, in a slow ripple thinking, quick speaking */
/* each bar its own layer: in the panel, a bar that shrank into a dot left its old pixels painted under the
   dots (thinking over listening), as WebKit doesn't clear them in the shared one there */
.orb i{display:block;flex:none;width:10px;height:18px;border-radius:5px;background:rgba(255,255,255,.92);will-change:transform;
transition:width .32s cubic-bezier(.23,1,.32,1),height .32s cubic-bezier(.23,1,.32,1)}
.orb i:nth-child(2){height:35px}.orb i:nth-child(3){height:24px}
.cmp.voice .orb i{width:7px;height:13px}.cmp.voice .orb i:nth-child(2){height:20px}
.talk:active .orb{filter:brightness(.93)}
.cmp.idle .orb{filter:grayscale(1);opacity:.55}
/* The five states (the user, 2026-10-11), each its own motion, not just its own speed:
   listening, nothing heard: the bars barely move, slowly; hearing you: as before, with you;
   thinking: three dots rising in turn; Claude talking: quick bars and rings going out;
   off: three flat dashes, grey. */
.cmp.listening .orb i{animation:calm 2.8s ease-in-out infinite}.cmp.listening .orb i:nth-child(2){animation-delay:-.9s}.cmp.listening .orb i:nth-child(3){animation-delay:-1.8s}
.cmp.listening.hearing .orb i{animation:bar 1s ease-in-out infinite}.cmp.listening.hearing .orb i:nth-child(2){animation-delay:-.35s}.cmp.listening.hearing .orb i:nth-child(3){animation-delay:-.7s}
.cmp.thinking .orb i:nth-child(n),.cmp.starting .orb i:nth-child(n){width:10px;height:10px;border-radius:50%;animation:dot 1.25s ease-in-out infinite}
.cmp.thinking .orb i:nth-child(2),.cmp.starting .orb i:nth-child(2){animation-delay:.16s}.cmp.thinking .orb i:nth-child(3),.cmp.starting .orb i:nth-child(3){animation-delay:.32s}
.cmp.speaking .orb{animation:speak 1.05s ease-in-out infinite}
.cmp.speaking .orb i{animation:bar .5s ease-in-out infinite}.cmp.speaking .orb i:nth-child(2){animation-delay:-.15s}.cmp.speaking .orb i:nth-child(3){animation-delay:-.3s}
.rp{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(80,70,229,.55);opacity:0;pointer-events:none}
/* Halo (the user's pick, 2026-10-12): the orb stays Standby's indigo, and a soft glow around it
   says the state: faint indigo listening, cyan with your voice, a turning rainbow thinking,
   violet while Claude talks. It stays inside the 12 around the orb, grown with your voice too. */
.halo{position:absolute;inset:-4px;border-radius:50%;filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
.cmp.listening .halo{background:#5046e5;animation:hbreathe 3.6s ease-in-out infinite}
.cmp.listening.hearing .halo{background:#22d3ee;animation:none;opacity:calc(.2 + .7 * var(--hl,0));transform:scale(calc(1 + .05 * var(--hl,0)))}
.cmp.thinking .halo,.cmp.starting .halo{background:conic-gradient(#5046e5,#8b5cf6,#ec4899,#f59e0b,#22d3ee,#5046e5);opacity:.9;animation:spin 2.4s linear infinite}
.cmp.speaking .halo{background:#a855f7;animation:hbreathe2 1.05s ease-in-out infinite}
.cmp.speaking .rp{box-shadow:0 0 0 2.4px rgba(168,85,247,.7)}
.cmp.holding .halo,.cmp.muted .halo,.cmp.paused .halo,.cmp.down .halo{display:none}
@keyframes hbreathe{0%,100%{opacity:.18}50%{opacity:.4}}
/* Claude talking, a fifth stronger (the user, 2026-10-27: too subtle); the rings can't go wider, the window's edge would cut them */
@keyframes hbreathe2{0%,100%{opacity:.55}50%{opacity:.95}}
/* listening, the two outer bars are eyes that blink now and then (the user: "just for cuteness") */
.cmp.listening:not(.hearing).blink .orb i:nth-child(1),.cmp.listening:not(.hearing).blink .orb i:nth-child(3){animation:blink .17s ease-in-out 1}
@keyframes blink{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
.cmp.speaking .rp{animation:ripple 1.8s ease-out infinite}.cmp.speaking .rp+.rp{animation-delay:.9s}
/* paused, and Claude out of reach: grey, as the ball was at .42 and .75 over the screen, but opaque, so
   the pill tucked under it never shows through */
.cmp.muted .orb,.cmp.paused .orb{filter:grayscale(1);background:var(--c-pz)}
.cmp.muted .orb i,.cmp.paused .orb i{background:var(--c-pzbar)}
.cmp.idle .orb i:nth-child(n),.cmp.muted .orb i:nth-child(n),.cmp.paused .orb i:nth-child(n){height:7px;animation:none}
.cmp.holding .orb i:nth-child(n){animation:none;width:7px;height:13px;border-radius:5px;opacity:1;transform:none}.cmp.holding .orb i:nth-child(2){height:20px}.cmp.holding .orb{filter:saturate(.75) brightness(1.04)}
/* Claude can't be reached: no words, the orb grey with a small red dot at its edge; the line on hover */
.cmp.down .orb{filter:grayscale(1);background:var(--c-down)}
.cmp.down .orbs:after{content:"";position:absolute;top:4%;right:4%;width:24%;height:24%;border-radius:50%;background:var(--c-rec)}
/* a paused call with finished work held for it: a plain filled red circle at the orb's edge, where the bell was
   and its size (the user, 10/30: not the bell), until Resume says it */
.cmp.waiting .orbs:after{content:"";position:absolute;top:4%;right:4%;width:22%;height:22%;border-radius:50%;background:var(--c-rec)}
body:not(.r) .cmp.down .orbs:after{right:auto;left:4%}body:not(.r) .cmp.waiting .orbs:after{right:auto;left:4%}
/* Standby's voice fetched the first time: a thin ring fills around the orb; no words, its percent on hover */
.cmp.prep .orbs:before{content:"";position:absolute;inset:-7px;border-radius:50%;
background:conic-gradient(var(--c-ring) calc(var(--pp,25) * 1%),rgba(80,70,229,.14) 0);
-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px))}
.cmp.prep.unknown .orbs:before{animation:spin 1.6s linear infinite}
.cmp.prep .orb:after{display:none}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes bar{0%,100%{height:12px}50%{height:33px}}
@keyframes calm{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.2)}}
@keyframes dot{0%,70%,100%{opacity:.45;transform:none}35%{opacity:1;transform:translateY(-6px)}}
/* out to 1.22: still inside the 12 around the orb, so never cut by the window's edge */
@keyframes ripple{from{transform:scale(1);opacity:.85}to{transform:scale(1.22);opacity:0}}
@keyframes speak{0%,100%{transform:scale(1)}26%{transform:scale(1.085)}58%{transform:scale(.975)}82%{transform:scale(1.05)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* a passing message, like "Standby isn't answering" */
.txt{padding:0 6px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--c-muted);font-weight:400}

/* the words' window, hugging its text: on a call only a mic macOS refuses is said */
.says{position:fixed;right:0;bottom:0;box-sizing:border-box;width:max-content;max-width:300px;padding:8px 14px;
font:400 15px/21px ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;text-align:right;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body:not(.r) .says{right:auto;left:0;text-align:left}
[data-v=top] .says{bottom:auto;top:0}
.says p{margin:0;color:var(--c-claude)}
.says p.warn{color:var(--c-attn)}
.says p.in{animation:fadein .34s ease both}

/* outside the panel (a preview), a stand-in for the glass and its shadow; the orb's canvas
   clips as its window does, so a preview shows anything the window's edge would cut */
.preview .cmp,.preview .says{margin:16px}
.preview .cmp{overflow:hidden}
.preview .ctls{background:var(--c-surface);box-shadow:0 1px 4px rgba(0,0,0,.14),inset 0 0 0 .5px var(--c-edge)}
.preview .says{background:var(--c-cap);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
.preview .says{border-radius:14px}
/* the call's visual card (the visual card drafts): the visual fills it, its sandbox under this page; this page draws
   only what's over it: the round close at the top right, Drawing… while it's made, and ‹ n / m › with New below */
.vcard{position:fixed;left:0;top:0;right:0;bottom:0;box-sizing:border-box;color:var(--c-text);font-weight:400}
.vcard .vx{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
color:var(--c-muted);background:var(--c-hover);border:0;padding:0;cursor:default;z-index:2}
.vcard .vx:hover{background:var(--c-press);color:var(--c-text)}
.vdraw{padding:14px 44px 14px 16px}
.vdraw b{display:block;font:600 13.5px/1.3 -apple-system,system-ui,sans-serif;color:var(--c-muted)}
.vdraw span{display:block;font-size:12.5px;line-height:1.4;color:var(--c-muted);margin-top:3px}
.vdraw i{display:block;height:9px;border-radius:5px;margin-top:9px;width:82%;background:linear-gradient(90deg,var(--c-hover),rgba(80,70,229,.14),var(--c-hover));
background-size:200% 100%;animation:vshim 1.4s ease-in-out infinite}.vdraw i+i{width:60%}
@keyframes vshim{from{background-position:100% 0}to{background-position:-100% 0}}
.vft{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 4px 14px;
font-size:11.5px;color:var(--c-muted)}
.vft .pager{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}.vft .pager>span{min-width:38px;text-align:center}
/* the pager on the card's fixed side, the orb's (each visual has its own width): ‹ › never move under the pointer */
body.r .vft{flex-direction:row-reverse}
/* below the orb (a top corner) the fixed edge is the top: the pager in a top row, the close keeping its corner */
[data-v=top] .vft{top:0;bottom:auto;padding:4px 44px 0 14px;justify-content:flex-start;gap:8px}body.r[data-v=top] .vft{justify-content:flex-start;padding:4px 44px 0 14px}
.vft button{height:22px;min-width:22px;border-radius:6px;border:0;padding:0;display:flex;align-items:center;justify-content:center;gap:4px;
color:var(--c-muted);background:var(--c-hover);font:inherit;cursor:default}
.vft button:disabled{opacity:.4}.vft button:not(:disabled):hover{background:var(--c-press);color:var(--c-text)}
.vft button.nx{padding:0 8px 0 6px;background:rgba(80,70,229,.12);color:var(--c-claude)}.vft button.nx i{font-style:normal;font-weight:650;font-size:11px}
.vnew{font-size:10.5px;font-weight:650;color:var(--c-claude);background:rgba(80,70,229,.12);padding:2px 6px;border-radius:5px}
.preview .vcard{background:var(--c-surface);border-radius:16px;box-shadow:var(--c-shadow),0 0 0 .5px var(--c-edge)}
@media (prefers-reduced-motion:reduce){.orb,.orb i,.orbs,.rail,.ctls,.says p,.vdraw i{animation:none!important;transition:none!important}}
.cmp .orb{cursor:default}
/* the call's visuals, its card closed: a small picture mark on the orb's edge, the red dot's size; a click opens the
   card again (the user, 2026-10-31). With the red dot too, it sits behind it, a little inward, like stacked cards. */
.vmk{display:none;position:absolute;top:4%;right:4%;width:22%;height:22%;border-radius:50%;background:#fff;color:#5046e5;
box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.12);align-items:center;justify-content:center;pointer-events:auto;cursor:default}
.vmk svg{width:62%;height:62%}.vmk:before{content:"";position:absolute;inset:-22%;border-radius:50%}
.cmp.vis .vmk{display:flex}.cmp.vis.waiting .vmk{top:2%;right:19%}
body:not(.r) .vmk{right:auto;left:4%}body:not(.r) .cmp.vis.waiting .vmk{right:auto;left:19%}
@media (prefers-color-scheme:dark){.vmk{background:#242426;color:#8f86ff;box-shadow:0 0 0 .5px rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.4)}}
</style></head><body>
<div class="cmp idle" id="cmp" style="display:none"></div>
<div class="says" id="says" style="display:none" aria-live="polite"><p id="sp"></p></div>
<div class="vcard" id="vcard" style="display:none"></div>
<script>
const SB = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sb;
const post = m => { if (SB) SB.postMessage(m) };
if (!SB) document.documentElement.classList.add("preview");
const WORDS = location.hash === "#words", CARD = location.hash === "#card", $ = id => document.getElementById(id);
// The orb's size in voice mode and at rest; its window is 24 more.
const ORB = 88, REST = 52, INSET = 12, W = 360, H = 112, PH = 40, GAP = 10;
const PHC = 72, PRC = 16;      // the panel on a call, pointed at: two rows, softer corners (it fits the orb's 88)
let ph = PH, pr = PH / 2;      // the pill's height and corners now: its last content's
document.documentElement.style.setProperty("--orb", ORB + "px");
document.documentElement.style.setProperty("--w", W + "px");
document.documentElement.style.setProperty("--h", H + "px");

// A press that moved is a drag (the panel moves the window and says so): its release is no click,
// so a drag never pauses the call or ends it (the user, 2026-10-26). The next press starts afresh.
let drag = false;
function dragged() { drag = true }
window.dragged = dragged;
function notClick(e) { if (drag) { e.stopPropagation(); e.preventDefault() } }
if (!WORDS && !CARD) {
  document.addEventListener("mousedown", () => { drag = false }, true);
  document.addEventListener("click", notClick, true);
  document.addEventListener("dblclick", notClick, true);
  const pill = $("cmp");
  if (!SB) {
    pill.addEventListener("mouseover", e => { if (e.target.closest && e.target.closest(".orbs,.ctls")) hover(true) });
    pill.addEventListener("mouseleave", () => hover(false));
  }
  pill.addEventListener("dblclick", e => { if (!e.target.closest("button")) post({ type: "expand" }) });
  document.addEventListener("contextmenu", e => { e.preventDefault(); menu(e.clientX, e.clientY) });
}

// One endpoint, read by both windows: every second, and quickly while voice mode is on.
// The eyes' blinks: every 2.2 to 7 s, a fifth of them doubled, only while it listens to quiet.
let blinkT = null, blinking = false;
function blinkLater() { clearTimeout(blinkT); blinkT = setTimeout(blinkNow, 2200 + Math.random() * 4800) }
function blinkNow(again) {
  const el = $("cmp"), c = el ? el.className : "";
  if (c.includes("listening") && !c.includes("hearing")) {
    blinking = true; render(); setTimeout(() => { blinking = false; render() }, 190);
    if (!again && Math.random() < .2) return setTimeout(() => blinkNow(true), 300);
  }
  blinkLater();
}
if (!WORDS && !CARD) blinkLater();
let polling = null;
async function poll(once) {
  try { C = await api("/api/companion") } catch (e) {}
  render();
  if (once) return;
  const fast = C && C.voice && C.voice.state && C.voice.state !== "off";
  polling = setTimeout(poll, fast ? 120 : 1000);
}
document.body.classList.add("r"); poll();
