<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standby</title>
<style>
/* Standby's setup window, before a first call or meeting (firstuse.py), in the look dictation's setup shares:
   no title-bar text, a heading and one line, every step in one grouped list, the current one opened in place
   with the window's one button; the start waits and goes by itself. */
:root{color-scheme:light dark;--bg:#ffffff;--group:#f5f5f7;--line:rgba(0,0,0,.08);--text:#1d1d1f;--muted:#6e6e73;--faint:#aeaeb2;
--accent:#0a7aff;--on-accent:#ffffff;--ok:#30b158;--rec:#e5484d;--warn:#c4540a;--focus:rgba(10,122,255,.5)}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e20;--group:#2a2a2d;--line:rgba(255,255,255,.08);--text:#f2f2f4;--muted:#98989f;--faint:#5c5c62;
--accent:#0a84ff;--on-accent:#ffffff;--ok:#32d74b;--rec:#f2555a;--warn:#ff9f0a;--focus:rgba(10,132,255,.5)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#head{height:32px}
#body{padding:4px 24px 20px}
.hd{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin:3px 0 0}
.sub:empty{display:none}
#steps{background:var(--group);border-radius:10px;margin-top:16px}
.st{display:grid;grid-template-columns:20px 1fr;column-gap:12px;padding:10px 14px;border-top:.5px solid var(--line);align-items:center}
.st:first-child{border-top:0}
.st .n{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
  border:1.25px solid var(--faint);color:var(--faint)}
.st .t{font-size:13px;color:var(--faint)}
.st.done .n{border:0;background:var(--ok);color:#fff}.st.done .t{color:var(--text)}
.st.skipped .t{color:var(--muted)}.st .s{grid-column:2;font-size:12px;color:var(--muted)}
.st.cur{padding:14px 14px 16px;align-items:start}
.st.cur .n{border-color:var(--accent);color:var(--accent)}.st.cur .t{color:var(--text);font-weight:600}
.st .w{grid-column:2;font-size:12.5px;color:var(--muted);margin-top:2px}
.st .how{grid-column:2;font-size:12.5px;color:var(--muted);margin-top:8px}.how b{color:var(--text);font-weight:600}
.act{grid-column:2;display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{height:24px;padding:0 12px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;box-shadow:0 .5px 1px rgba(0,0,0,.15)}
.btn:disabled{opacity:.6;cursor:default}
.note{font-size:12px;color:var(--muted)}
.lk{font-size:12.5px;color:var(--accent)}
.wait{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.wait i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--faint);border-top-color:var(--muted);display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.wait i{animation:none}}
.err{font-size:13px;color:var(--warn);margin:14px 0 0}
#retry{margin:2px 0 0;font-size:12.5px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;min-height:24px}
.foot .q{font-size:13px;color:var(--muted)}
.go{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.go i{width:7px;height:7px;border-radius:50%;background:var(--rec)}
</style></head>
<body>
<div id="head" data-drag></div>
<div id="body" data-drag>
  <div class="hd" id="title"></div>
  <p class="sub" id="sub"></p>
  <div id="steps"></div>
  <p class="err" id="err" hidden></p>
  <p class="note" id="retry" hidden></p>
  <!-- Cancel while it waits; "Starting your …" in its place once it starts; Close, filled, once it couldn't start -->
  <div class="foot" id="foot"><button type="button" class="q" id="cancel" data-do="cancel" data-nodrag>Cancel</button>
    <div class="go" id="go" hidden><i></i><span></span></div><span></span>
    <button type="button" class="btn" id="close" data-do="close" hidden></button></div>
</div>
<script>
const TOKEN = "__SB_TOKEN__";
const $ = id => document.getElementById(id);
const TICK = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");     // the how-to's **Standby**
async function api(path, body) {
  const r = await fetch(path, body === undefined ? { headers: { "x-standby-token": TOKEN } }
    : { method: "POST", headers: { "content-type": "application/json", "x-standby-token": TOKEN }, body: JSON.stringify(body) });
  return r.json();
}
let busy = false, shown = "";
function step(s) {
  const done = s.state === "done";
  let act = "";
  if (s.button) act = (s.how ? '<span class="how">' + bold(s.how) + "</span>" : "")
    + '<div class="act"><button type="button" class="btn" data-do="' + esc(s.do) + '">' + esc(s.button) + "</button>"
    + (s.waiting ? '<span class="wait"><i></i>' + esc(s.note) + "</span>" : s.note ? '<span class="note">' + esc(s.note) + "</span>" : "")
    + (s.skip ? '<button type="button" class="lk" data-do="skip_sound">' + esc(s.skip) + "</button>" : "") + "</div>";
  else if (s.state === "skipped" && s.note) act = '<span class="s">' + esc(s.note) + "</span>";
  return '<div class="st ' + ({ current: "cur", done: "done", skipped: "skipped" }[s.state] || "") + '" data-nodrag="' + (s.button ? "1" : "") + '">'
    + '<span class="n">' + (done ? TICK : s.state === "skipped" ? "\u2013" : s.n) + '</span><span class="t">' + esc(s.name) + "</span>"
    + (s.state === "current" ? '<span class="w">' + esc(s.why) + "</span>" : "") + act + "</div>";
}
function paint(v) {
  const key = JSON.stringify(v);
  if (key === shown) return;
  shown = key;
  $("title").textContent = v.title || "";
  $("sub").textContent = v.sub || "";
  $("steps").innerHTML = (v.steps || []).map(step).join("");
  $("err").hidden = !v.error; $("err").textContent = v.error || "";
  $("retry").hidden = !v.retry; $("retry").textContent = v.retry || "";
  $("go").hidden = !v.go; $("go").querySelector("span").textContent = v.go || "";
  $("cancel").hidden = !!(v.go || v.button);
  $("close").hidden = !v.button; $("close").textContent = v.button || "";
  fit();
}
function fit() {
  const w = window.pywebview && window.pywebview.api;
  if (w && w.fit) w.fit(Math.ceil($("body").getBoundingClientRect().bottom));     // the content's own height, never the viewport's
}
async function setupNow() {
  try { const v = await api("/api/setup"); if (!v.gone) paint(v) } catch (e) {}
}
window.setupNow = setupNow;
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-do]");
  if (!b || busy) return;
  busy = true; b.disabled = true;
  try { await api("/api/setup", { do: b.dataset.do }) } catch (e) {}
  busy = false;
  await setupNow();
});
// The window moves by its top and its empty parts
document.addEventListener("mousedown", e => {
  const w = window.pywebview && window.pywebview.api;
  if (!w || !w.window_drag || e.button !== 0 || !e.target.closest("[data-drag]")) return;
  if (e.target.closest("button,a,.how,[data-nodrag='1']")) return;
  w.window_drag();
});
window.addEventListener("pywebviewready", fit);
setupNow();
setInterval(setupNow, 500);                      // ticks follow System Settings live
</script>
</body></html>
